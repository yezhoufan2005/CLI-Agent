[project]
name = "cli-agent-yzf"
version = "0.6.0"
description = "An autonomous coding agent for the terminal"
readme = "README.md"
authors = [
    { name = "yezhoufan2005", email = "176495279+yezhoufan2005@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
cli-agent = "cli_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

# "cli-agent" is taken on PyPI; the distribution is "cli-agent-yzf", the module and command stay cli_agent / cli-agent
[tool.uv.build-backend]
module-name = "cli_agent"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "ruff==0.14.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# E2E fixture repos are test inputs for the agent, not project code.
extend-exclude = ["tests/e2e"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S603", "S607", "S101", "RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
norecursedirs = ["tests/e2e"]
# Warnings fail the suite, so leaks such as an unclosed pipe (ResourceWarning) surface.
filterwarnings = ["error"]
